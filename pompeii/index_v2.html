<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pompeii: The City That Disappeared in One Day · Buried Chronicles</title>
<style>
  /* Display: Playfair Display (titles, italic gold). Caps: Cinzel (kickers, labels, maps). Both SIL OFL. */
  @font-face { font-family: Display; src: url(fonts/playfair-display-latin-800-italic.woff2) format('woff2'); font-weight: 800; font-style: italic; }
  @font-face { font-family: Display; src: url(fonts/playfair-display-latin-400-italic.woff2) format('woff2'); font-weight: 400; font-style: italic; }
  @font-face { font-family: Display; src: url(fonts/playfair-display-latin-700-normal.woff2) format('woff2'); font-weight: 700; font-style: normal; }
  @font-face { font-family: Display; src: url(fonts/playfair-display-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-style: normal; }
  @font-face { font-family: Caps; src: url(fonts/cinzel-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Caps; src: url(fonts/cinzel-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Caps; src: url(fonts/cinzel-latin-900-normal.woff2) format('woff2'); font-weight: 900; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub</div>
<script type="module" src="film_v2.js"></script>
</body>
</html>
